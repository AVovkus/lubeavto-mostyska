<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Технічні роботи — Любе Авто Мостиська</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f6f6;
      color: #141414;
      line-height: 1.5;
    }
    .bar {
      background-color: #222222;
      border-bottom: 3px solid #f15f27;
      padding: 16px 20px;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .bar span { color: #f15f27; }
    .wrap {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-top: 5px solid #f15f27;
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: clamp(22px, 3vw, 30px); line-height: 1.22; }
    p { margin: 0 0 16px; color: #555555; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      color: #ffffff;
    }
    .btn-phone { background: #2c8a4b; }
    .btn-tg { background: #2481d7; }
    @media (max-width: 560px) {
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="bar">ЛЮБЕ АВТО <span>МОСТИСЬКА</span></header>
  <main class="wrap">
    <section class="card">
      <h1>Зараз на сайті проводяться технічні роботи</h1>
      <p>
        Оновлюємо каталог авто та сервіси майданчика. Незабаром сайт знову повернеться до роботи, а наш автомайданчик у м. Мостиська працює у звичному режимі (Пн–Нд: 10:00 – 18:00).
      </p>
      <div class="actions">
        <a href="tel:+380677002300" class="btn btn-phone">Зателефонувати: +38 (067) 700 2300</a>
        <a href="https://t.me/+380677002300" target="_blank" rel="noopener noreferrer" class="btn btn-tg">Написати в Telegram</a>
      </div>
    </section>
  </main>
</body>
</html>
