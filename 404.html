<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Любе Авто Мостиська</title>
  <link rel="icon" href="/favicon.ico?v=20261128" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=20261128" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon-96.png?v=20261128" />
  <script>
    (function () {
      var path = (window.location.pathname || "").toLowerCase();
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var target = null;

      if (path === "/lubeavto-mostyska" || path.indexOf("/lubeavto-mostyska/") === 0) {
        var sub = path.slice("/lubeavto-mostyska".length).replace(/^\/+|\/+$/g, "");
        if (!sub || sub === "index" || sub === "index.html") {
          target = "/";
        } else if (sub === "about" || sub === "about.html") {
          target = "/about.html";
        } else if (sub === "calculator" || sub === "calculator.html") {
          target = "/calculator.html";
        } else if (sub === "admin" || sub === "admin.html") {
          target = "/admin.html";
        } else {
          target = "/" + sub;
        }
      } else if (path === "/about") {
        target = "/about.html";
      } else if (path === "/calculator") {
        target = "/calculator.html";
      } else if (path === "/admin") {
        target = "/admin.html";
      }

      if (target) {
        window.location.replace(target + search + hash);
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #141416;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #1e1e22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 800;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.5;
      color: #b8bcc4;
    }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      background: #f15f27;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover {
      background: #d94d18;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Любе Авто Мостиська</h1>
    <p>Сайт переїхав на основну адресу. Якщо переадресація не спрацювала автоматично, натисніть кнопку нижче.</p>
    <a class="btn" href="/">Перейти на сайт</a>
  </main>
</body>
</html>
